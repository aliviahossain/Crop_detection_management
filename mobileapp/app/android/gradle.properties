org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin incremental compilation is disabled deliberately.
#
# Its cache lives under build/<plugin>/kotlin/... and repeatedly corrupted
# itself here, failing the build with "Could not close incremental caches"
# and "Storage for [...] is already registered". The original trigger was the
# pub cache sitting on C: while the project sits on D: - Kotlin's path
# converter calls File.relativeTo(), which throws across drive letters - and
# once the cache was poisoned the compile daemon kept re-registering stale
# storages even after the drive mismatch was fixed.
#
# PUB_CACHE now points at D:\dev\pub-cache so the root cause is gone, but the
# incremental cache buys us almost nothing: the only Kotlin in this build is
# two small plugin modules that change when we bump a dependency, roughly
# never. Trading a few seconds of rebuild for a class of failure that costs
# an afternoon to diagnose is the right side of that deal.
kotlin.incremental=false
