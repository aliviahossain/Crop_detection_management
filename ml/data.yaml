# ============================================================================
#  DO NOT PASS THIS FILE TO TRAINING DIRECTLY.
#
#  `path:` below points at a directory that does not exist in a fresh clone.
#  Training against it either errors out or, worse, picks up a stale dataset.
#  ml/train_yolo.py refuses this file by name for that reason.
#
#  The real dataset config is GENERATED by ml/prepare_dataset.py at its --out
#  directory, with the correct absolute path filled in:
#
#      python ml/prepare_dataset.py --plantvillage ... --out /kaggle/working/potato_yolo
#      python ml/train_yolo.py --data /kaggle/working/potato_yolo/data.yaml
#
#  This file exists for exactly one reason: to be the checked-in, reviewable
#  declaration of the CLASS ORDER, which backend/tests/test_class_lockstep.py
#  asserts against taxonomy.CLASS_NAMES on every test run.
# ============================================================================
#
#  The class order here is authoritative and MUST stay in lockstep with
#  backend/app/services/taxonomy.py:CLASS_NAMES. The serving layer maps a model
#  output index straight to these names; swapping two lines here silently
#  mislabels every prediction in production -- the model says index 1 meaning
#  one disease, the backend reads index 1 as another, and every component
#  downstream agrees with every other while all of them are wrong.

path: ../datasets/potato_yolo # PLACEHOLDER - see the warning above
train: images/train
val: images/val
test: images/test

names:
  0: potato_early_blight
  1: potato_late_blight
  2: potato_healthy
